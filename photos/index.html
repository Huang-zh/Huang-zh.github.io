/* ===== 写风页：瀑布流 + Lightbox（内联样式，仅本页生效） ===== */

/* 瀑布流：CSS 多列实现，时间倒序（最新在上、在左） */
.photos-wall {
  column-count: 3;
  column-gap: 14px;
}
.photo {
  /* 覆盖主题 figure { display: table }，避免表格布局重算图片宽高导致变形 */
  display: block;
  break-inside: avoid;
  margin-bottom: 14px;
  border-radius: 8px;
  overflow: hidden;
  cursor: zoom-in;
  line-height: 0;
  /* 入场动画：淡入 + 上移放大 */
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.photo.in { opacity: 1; transform: none; }
/* 未加载到的批次：隐藏但保留占位高度，避免瀑布流跳动 */
.photo-pending { visibility: hidden; }
.photo img {
  width: 100%;
  height: auto; /* 关键：高度跟随宽度按原图比例缩放，防止被拉长 */
  aspect-ratio: attr(width) / attr(height);
  display: block;
  transition: transform 0.35s ease;
}
.photo:hover img { transform: scale(1.03); }
@media (max-width: 900px) { .photos-wall { column-count: 2; } }
@media (max-width: 520px) { .photos-wall { column-count: 1; } }
/* 系统开启“减少动态效果”时直接显示 */
@media (prefers-reduced-motion: reduce) {
  .photo {
    opacity: 1;
    transform: none;
    transition: none;
  }
  .photo-pending { visibility: visible; }
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  padding: 20px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 92vw;
  max-height: 70vh;
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}
.lightbox-info {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  padding: 14px 24px 18px;
  text-align: center;
  backdrop-filter: blur(4px);
}
.lightbox-desc { font-size: 15px; margin-bottom: 6px; }
.lightbox-meta { font-size: 13px; opacity: 0.85; }
.lightbox-close {
  position: absolute;
  top: 12px;
  right: 18px;
  background: none;
  border: none;
  color: #fff;
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  z-index: 2;
}
.lightbox-prev,
.lightbox-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.15);
  border: none;
  color: #fff;
  font-size: 26px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 2;
}
.lightbox-prev { left: 16px; }
.lightbox-next { right: 16px; }
@media (max-width: 520px) {
  .lightbox-prev { left: 6px; }
  .lightbox-next { right: 6px; }
}
</style>

<script>
(function () {
  var wall = document.getElementById('photosWall');
  var photos = Array.prototype.slice.call(wall.querySelectorAll('.photo'));
  if (!photos.length) return;

  /* ---- 分批滚动加载：每批 12 张，滚动接近时加载下一批 ---- */
  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var noIO = !('IntersectionObserver' in window);
  var BATCH = 12;
  var DELAY = 60;
  var batches = [];
  for (var i = 0; i < photos.length; i += BATCH) {
    batches.push(photos.slice(i, i + BATCH));
  }

  function animateIn(batch) {
    batch.forEach(function (p, idx) {
      p.style.transitionDelay = (idx * DELAY) + 'ms';
      p.classList.add('in');
    });
  }

  if (noIO || reduceMotion) {
    batches.forEach(animateIn);
  } else {
    animateIn(batches[0]);
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var n = parseInt(e.target.getAttribute('data-batch'), 10);
        var batch = batches[n];
        if (batch) {
          batch.forEach(function (p) { p.classList.remove('photo-pending'); });
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { animateIn(batch); });
          });
          e.target.remove();
        }
      });
    }, { rootMargin: '500px 0px', threshold: 0 });
    for (var b = 1; b < batches.length; b++) {
      var s = document.createElement('div');
      s.className = 'ph-sentinel';
      s.setAttribute('data-batch', b);
      batches[b][0].parentNode.insertBefore(s, batches[b][0]);
      batches[b].forEach(function (p) { p.classList.add('photo-pending'); });
      io.observe(s);
    }
  }

  /* ---- Lightbox ---- */
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbDesc = document.getElementById('lbDesc');
  var lbMeta = document.getElementById('lbMeta');
  var current = -1;

  function show(i) {
    current = (i + photos.length) % photos.length;
    var p = photos[current];
    var img = p.querySelector('img');
    lbImg.src = p.getAttribute('data-full') || img.src;
    lbImg.alt = img.alt || '';
    lbDesc.textContent = p.getAttribute('data-desc') || '';
    var loc = p.getAttribute('data-location');
    var date = p.getAttribute('data-date');
    var meta = [];
    if (loc) meta.push('📍 ' + loc);
    if (date) meta.push('📅 ' + date);
    lbMeta.textContent = meta.join('　');
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function hide() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  photos.forEach(function (p, i) {
    p.addEventListener('click', function () { show(i); });
  });

  document.getElementById('lbClose').addEventListener('click', hide);
  document.getElementById('lbPrev').addEventListener('click', function (e) {
    e.stopPropagation();
    show(current - 1);
  });
  document.getElementById('lbNext').addEventListener('click', function (e) {
    e.stopPropagation();
    show(current + 1);
  });
  lb.addEventListener('click', function (e) {
    if (e.target === lb) hide();
  });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') hide();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>

                var days = RunDays + "天" + RunHours + "时" + RunMinutes + "分" + RunSeconds + "秒";
                document.getElementById(id).innerHTML = days;
            }
